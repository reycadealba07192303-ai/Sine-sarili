# Encrypts uploaded films, episodes, and teasers with DRM for the hosted (Vercel) site.
# Vercel Functions can't run Shaka Packager on full-length videos, so this job does it.
# Runs every 15 minutes, on demand, and right after an admin saves a title (repository_dispatch).
name: Encrypt videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [encrypt-videos]

concurrency:
  group: encrypt-videos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SINESARILI_API_URL: ${{ secrets.SINESARILI_API_URL }}
      DRM_WORKER_SECRET: ${{ secrets.DRM_WORKER_SECRET }}
      PUBLIC_BLOB_READ_WRITE_TOKEN: ${{ secrets.PUBLIC_BLOB_READ_WRITE_TOKEN }}
      PRIVATE_BLOB_READ_WRITE_TOKEN: ${{ secrets.PRIVATE_BLOB_READ_WRITE_TOKEN }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SINESARILI_API_URL" ] || [ -z "$DRM_WORKER_SECRET" ] || [ -z "$PUBLIC_BLOB_READ_WRITE_TOKEN" ] || [ -z "$PRIVATE_BLOB_READ_WRITE_TOKEN" ]; then
            echo "Encryption secrets are not set yet; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci --workspace @sinesarili/api --include-workspace-root=false

      - name: Install Shaka Packager
        if: steps.config.outputs.ready == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/packager" https://github.com/shaka-project/shaka-packager/releases/download/v3.9.3/packager-linux-x64
          chmod +x "$RUNNER_TEMP/packager"
          "$RUNNER_TEMP/packager" --version

      - name: Encrypt waiting videos
        if: steps.config.outputs.ready == 'true'
        env:
          PACKAGER: ${{ runner.temp }}/packager
        run: node --import tsx apps/api/scripts/encrypt-worker.ts
